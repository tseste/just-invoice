[project]
name = "just-invoice"
version = "0.1.0"
description = "Simple Flask invoice application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=50.0.0",
    "flask>=3.0,<4.0",
    "flask-babel>=4.0,<5.0",
    "flask-wtf>=1.2,<2.0",
    "pdfkit>=1.0,<2.0",
    "pymysql>=1.1,<2.0",
    "python-dotenv>=1.0,<2.0",
    "wtforms>=3.1,<4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0",
    "ruff>=0.15.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
